name: Quality
on:
  push:
    branches: [main]
  pull_request:
  # The runner image rolls forward and its Xcode with it, which can break a repository nobody
  # changed. A weekly run finds that on a Monday rather than inside someone's pull request.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  validate:
    name: Validate
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: ./x quality
      - name: Check the committed diff
        if: github.event_name == 'pull_request'
        run: python3 Scripts/hooks/check.py "origin/${{ github.base_ref }}"
