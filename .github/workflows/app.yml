name: App
on:
  push:
    branches: [main]
  pull_request:
  # The runner image rolls forward and its Xcode with it, which can break a repository nobody
  # changed. A weekly run finds that on a Monday rather than inside someone's pull request.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    name: Build and Test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: ./x test
      - run: ./x app
      - name: Verify the bundle
        run: |
          codesign --verify --deep build/Aero.app
          test -f build/Aero.app/Contents/Resources/Assets.car
          test -f build/Aero.app/Contents/Resources/app.icns
          test -d build/Aero.app/Contents/Resources/Browser_Browser.bundle
